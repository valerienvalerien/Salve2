<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
<meta name="referrer" content="no-referrer" />
<title>Salverys — Accès partenaire</title>
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
<link rel="stylesheet" href="../assets/site.css" />
<style>
  .dl-wrap { max-width: 900px; margin: 0 auto; padding: 44px 20px 90px; }
  .dl-lock { max-width: 430px; margin: 9vh auto 0; text-align: center; }
  .dl-lock h1 { font-size: 25px; margin-bottom: 8px; }
  .dl-lock p { color: var(--text-soft); font-size: 14.5px; margin-bottom: 22px; }
  .dl-lock input[type="password"] {
    width: 100%; padding: 13px 16px; font-size: 16px; letter-spacing: .04em;
    border: 1.5px solid var(--line); border-radius: 10px; margin-bottom: 12px; box-sizing: border-box;
  }
  .dl-error { color: var(--danger, #b3261e); font-size: 13.5px; min-height: 18px; margin-top: 10px; }

  .dl-actions { display: flex; gap: 10px; justify-content: flex-end; margin: 0 0 20px; flex-wrap: wrap; }

  /* ---- bandeau nominatif ---- */
  .dl-band {
    display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: space-between; align-items: baseline;
    background: #fff6e8; border: 1px solid #e8c98a; color: #7a5410; border-radius: 10px;
    padding: 10px 15px; font-size: 12.5px; font-weight: 600; letter-spacing: .2px; margin-bottom: 26px;
  }
  .dl-band .dl-exp { font-weight: 700; }
  .dl-expired { background: #fdecea; border-color: #e6a49b; color: #8a2f1f; }

  /* ---- typo document ---- */
  .dl-doc h1 { font-size: 30px; line-height: 1.2; margin: 6px 0 12px; }
  /* Titre en --primary et non --accent : sur le thème IT l'accent est un jaune
     pastel, illisible sur fond blanc. L'accent ne sert que de filet décoratif. */
  .dl-doc h2 {
    font-size: 15px; text-transform: uppercase; letter-spacing: .08em; color: var(--primary);
    margin: 44px 0 12px; padding-bottom: 8px; border-bottom: 2px solid var(--accent);
  }
  .dl-lead { font-size: 16.5px; color: var(--text-soft); line-height: 1.62; }
  .dl-doc ul { padding-left: 20px; margin: 10px 0; } .dl-doc li { margin: 7px 0; }
  .dl-doc p { margin: 10px 0; }
  .dl-note { font-size: 13px; color: var(--text-mute); line-height: 1.55; }

  /* ---- rappel d'appel ---- */
  .dl-quote { border-left: 3px solid var(--accent); background: var(--accent-tint); border-radius: 0 10px 10px 0; padding: 16px 20px; }
  .dl-quote ul { margin: 0; } .dl-quote li { margin: 8px 0; }

  /* ---- deux colonnes ---- */
  .dl-two { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .dl-box { border: 1.5px solid var(--line); border-radius: 12px; padding: 16px 18px; }
  .dl-box h3 { font-size: 14px; margin-bottom: 8px; }
  .dl-box.out { background: var(--bg-soft); border-style: dashed; }
  .dl-box ul { padding-left: 18px; } .dl-box li { font-size: 14px; }

  /* ---- tableaux ---- */
  .dl-table { width: 100%; border-collapse: collapse; margin: 12px 0 8px; font-size: 14.5px; }
  .dl-table th, .dl-table td { border: 1px solid var(--line); padding: 10px 12px; text-align: left; }
  .dl-table th { background: var(--bg-soft); font-size: 13px; }
  .dl-table td.num, .dl-table th.num { text-align: right; white-space: nowrap; }
  .dl-table tr.hi td { background: var(--accent-tint); font-weight: 700; }
  .dl-scroll { overflow-x: auto; }

  /* ---- bloc marge ---- */
  .dl-gain { background: var(--primary); color: #fff; border-radius: 14px; padding: 22px 24px; margin-top: 14px; }
  .dl-gain .k { font-size: 34px; font-weight: 800; line-height: 1.1; color: var(--accent); }
  .theme-it .dl-gain .k { color: var(--accent); }
  .dl-gain .l { font-size: 13.5px; opacity: .82; margin-top: 6px; }
  .dl-gain .s { font-size: 13.5px; opacity: .9; margin-top: 12px; border-top: 1px solid rgba(255,255,255,.2); padding-top: 12px; }

  /* ---- planning ---- */
  .dl-steps { list-style: none; padding: 0; margin: 14px 0 0; }
  .dl-steps li { display: grid; grid-template-columns: 132px 1fr; gap: 14px; padding: 12px 0; border-top: 1px solid var(--line-soft); }
  .dl-steps li:first-child { border-top: 0; }
  .dl-steps .d { font-weight: 700; font-size: 13.5px; color: var(--primary); }
  .dl-steps .t { font-size: 14.5px; }
  .dl-steps .t b { display: block; }
  .dl-steps .t span { color: var(--text-soft); font-size: 13.5px; }

  /* ---- garanties ---- */
  .dl-g { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 12px; }
  .dl-g div { border: 1.5px solid var(--line); border-left: 3px solid var(--accent); border-radius: 0 10px 10px 0; padding: 13px 16px; }
  .dl-g b { display: block; font-size: 14px; margin-bottom: 4px; }
  .dl-g span { font-size: 13.5px; color: var(--text-soft); }

  /* ---- concessions (couche 3 : ce qui a ete accorde sur ce deal precis) ---- */
  .dl-accord { background: var(--accent-tint); border: 1.5px solid var(--accent-soft); border-radius: 12px; padding: 16px 22px; margin-top: 12px; }
  .dl-accord ul { padding-left: 20px; margin: 0; }
  .dl-accord li { margin: 9px 0; font-size: 14.5px; }

  /* ---- CTA ---- */
  .dl-cta { margin-top: 40px; padding: 24px; background: var(--bg-soft); border-radius: 14px; text-align: center; }
  .dl-cta h3 { font-size: 19px; margin-bottom: 8px; }
  .dl-cta p { color: var(--text-soft); font-size: 14.5px; max-width: 520px; margin: 0 auto 18px; }
  .dl-cta .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

  /* ---- filigrane (impression) ---- */
  .dl-wm { display: none; }

  @media (max-width: 700px) {
    .dl-two, .dl-g { grid-template-columns: 1fr; }
    .dl-steps li { grid-template-columns: 1fr; gap: 2px; }
  }

  @media print {
    .nav, .footer, .dl-actions, .dl-lock, .dl-cta .row { display: none !important; }
    .dl-wrap { padding: 0; max-width: none; }
    .dl-doc { font-size: 11.5pt; }
    .dl-doc h1 { font-size: 18pt; } .dl-doc h2 { font-size: 11pt; margin-top: 20px; }
    .dl-table { font-size: 9.5pt; } .dl-gain { color: #000; background: #f2f2f2; border: 1px solid #999; }
    .dl-gain .k { color: #000; }
    .dl-steps li, .dl-box, .dl-g div, .dl-quote { break-inside: avoid; }
    a { color: inherit; text-decoration: none; }
    .dl-wm {
      display: block; position: fixed; inset: 0; z-index: 9999; pointer-events: none;
      color: #000; opacity: .07; font-size: 30pt; font-weight: 800; text-align: center;
      transform: rotate(-32deg); line-height: 2.6; overflow: hidden;
    }
  }
</style>
</head>
<body class="theme-it">

<header class="nav">
  <div class="container nav-inner">
    <a class="brand" href="../index.html"><img class="brand-logo" src="../assets/logo-salverys.svg" alt="Salverys" /></a>
  </div>
</header>

<div class="dl-wrap">

  <div class="dl-lock" id="dl-lock">
    <h1>Accès partenaire</h1>
    <p>Ce document est nominatif. Saisissez le code d'accès qui vous a été communiqué à l'issue de notre échange.</p>
    <form id="dl-form">
      <input type="password" id="dl-pass" placeholder="Code d'accès" autocomplete="one-time-code" autofocus />
      <button type="submit" class="btn btn-primary" style="display:block;margin:0 auto;padding:13px 44px;">Ouvrir le document</button>
      <div class="dl-error" id="dl-error"></div>
    </form>
  </div>

  <div id="dl-content" hidden>
    <div class="dl-actions">
      <button class="btn btn-outline" id="dl-print">Imprimer / PDF</button>
      <button class="btn btn-outline" id="dl-logout">Verrouiller</button>
    </div>
    <div id="dl-body"></div>
  </div>

</div>

<footer class="footer">
  <div class="container"><div class="footer-meta"><span>© Salverys</span><span>Document nominatif et confidentiel</span></div></div>
</footer>

  var b64 = function (s) { var bin = atob(s), u = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; };
  var $ = function (id) { return document.getElementById(id); };
  var SS_KEY = 'salverys_deal_exemple-msp';

  function show(html) {
    $('dl-body').innerHTML = html;
    $('dl-lock').hidden = true;
    $('dl-content').hidden = false;
    document.title = 'Salverys — proposition (confidentiel)';
  }

  async function unlock(pw) {
    var enc = new TextEncoder();
    var km = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64(VAULT.salt), iterations: VAULT.iter, hash: 'SHA-256' },
      km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(VAULT.iv) }, key, b64(VAULT.data));
    return new TextDecoder().decode(plain);
  }

  /* Le code d'accès est normalisé (majuscules, espaces/tirets ignorés) pour être
     dictable au téléphone sans erreur de saisie. */
  function norm(s) { return (s || '').toUpperCase().replace(/[\s\-_.]/g, ''); }

  $('dl-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var pw = norm($('dl-pass').value);
    $('dl-error').textContent = '';
    unlock(pw).then(function (html) {
      try { sessionStorage.setItem(SS_KEY, pw); } catch (_) {}
      show(html);
    }).catch(function () {
      $('dl-error').textContent = 'Code d’accès incorrect.';
    });
  });

  $('dl-print').addEventListener('click', function () { window.print(); });
  $('dl-logout').addEventListener('click', function () {
    try { sessionStorage.removeItem(SS_KEY); } catch (_) {}
    location.reload();
  });

  try {
    var saved = sessionStorage.getItem(SS_KEY);
    if (saved) unlock(saved).then(show).catch(function () { sessionStorage.removeItem(SS_KEY); });
  } catch (_) {}

  if (!window.isSecureContext) {
    $('dl-error').textContent = 'Cette page nécessite HTTPS (ou localhost).';
  }
})();
