# Déploiement Netlify — seul le contenu de _site est servi.
# Les .md (stratégie, prix), le CRM, la trésorerie et tools/ ne sont jamais publiés.
[build]
  command = "bash tools/build-site.sh"
  publish = "_site"

# Les espaces partenaires ne doivent être ni indexés ni mis en cache par des intermédiaires.
[[headers]]
  for = "/espace-client*.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# Pages de closing nominatives (une par deal). Même règle, plus stricte :
# pas d'indexation, pas de cache, et pas de referer fuité vers un tiers —
# l'URL contient le token qui donne accès au document.
[[headers]]
  for = "/espace/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"

# Vidéos de fond des landing pages (tools/landing-video/render.mjs). Noms non versionnés :
# cache d'une semaine, pas plus, pour qu'un nouveau rendu se propage.
[[headers]]
  for = "/assets/video/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
