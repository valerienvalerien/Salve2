<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Scène A — Sous votre marque</title>
<!--
  Scénario A — « Sous votre marque » (18 s, boucle).
  Un centre de services générique, au logo du partenaire (« Votre ESN »), reçoit des tickets N1.
  Chacun passe Nouveau → Pris en charge → Résolu ou Escaladé N2 (transmis au N2 du partenaire),
  toujours au nom de « Support Votre ESN ».
  Plan rapproché sur la réponse envoyée au client final : signature du partenaire, jamais Salverys.
  Toutes les données sont fictives (bandeau « Illustration » dans l'image).
-->
<link rel="stylesheet" href="scene.css">
<style>
  .panel { position: absolute; border-radius: 22px; background: rgba(8,36,47,.82); border: 1px solid rgba(255,255,255,.12);
           box-shadow: 0 40px 90px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06); overflow: hidden; }
  .p-head { height: 70px; display: flex; align-items: center; gap: 16px; padding: 0 26px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.035); }
  .dots { display: flex; gap: 7px; } .dots i { width: 11px; height: 11px; border-radius: 50%; background: rgba(255,255,255,.18); }
  .p-logo { height: 38px; padding: 0 16px; display: flex; align-items: center; border: 2px dashed rgba(255,255,255,.4); border-radius: 10px;
            font: 700 14px 'Inter'; letter-spacing: .14em; color: rgba(255,255,255,.85); }
  .p-title { font: 600 18px 'Inter'; color: rgba(255,255,255,.75); }
  .p-user { margin-left: auto; display: flex; align-items: center; gap: 10px; font: 600 15px 'Inter'; color: rgba(255,255,255,.8); }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--coral); color: #fff; display: grid; place-items: center; font: 800 13px 'Inter'; }
  .p-tabs { height: 52px; display: flex; align-items: flex-end; gap: 30px; padding: 0 26px; border-bottom: 1px solid var(--line); font: 600 15px 'Inter'; color: rgba(255,255,255,.5); }
  .p-tabs span { padding-bottom: 14px; } .p-tabs .on { color: #fff; box-shadow: inset 0 -3px 0 var(--coral); }
  .p-cols { height: 40px; display: grid; grid-template-columns: 1fr 210px; align-items: center; padding: 0 26px; font: 700 12px 'Inter'; letter-spacing: .1em; text-transform: uppercase; color: rgba(255,255,255,.38); border-bottom: 1px solid var(--line); }
  .rows { position: absolute; left: 0; right: 0; }
  .row { position: absolute; left: 0; right: 0; display: grid; grid-template-columns: 1fr 210px; align-items: center; padding: 0 26px; border-bottom: 1px solid var(--line); }
  .r-id { font: 700 14px 'JBM'; color: var(--coral-soft); margin-bottom: 5px; }
  .r-title { font: 700 20px 'Inter'; color: #fff; letter-spacing: -.01em; white-space: nowrap; }
  .r-who { font: 500 15px 'Inter'; color: rgba(255,255,255,.55); margin-top: 4px; }
  .r-stat { position: relative; height: 62px; }
  .pill { position: absolute; left: 0; top: 4px; height: 32px; padding: 0 14px; border-radius: 99px; display: inline-flex; align-items: center; gap: 8px; font: 700 14px 'Inter'; white-space: nowrap; }
  .pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .pill.new { background: rgba(255,255,255,.12); color: rgba(255,255,255,.85); }
  .pill.take { background: rgba(224,107,82,.2); color: #FF9C85; }
  .pill.done { background: rgba(47,181,126,.2); color: #5FE0A6; }
  .pill.esc { background: rgba(240,180,41,.2); color: #FFCB57; }
  .by { position: absolute; left: 2px; top: 42px; font: 600 13px 'Inter'; color: rgba(255,255,255,.5); white-space: nowrap; }
  .flash { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(224,107,82,.22), transparent 70%); pointer-events: none; }

  .mail { position: absolute; border-radius: 18px; background: var(--cream); color: #16303B; box-shadow: 0 40px 100px rgba(0,0,0,.55); overflow: hidden; }
  .m-head { padding: 22px 28px 16px; border-bottom: 1px solid #E4DCCD; font: 500 16px 'Inter'; color: #5C6A70; line-height: 1.75; }
  .m-head b { color: #16303B; font-weight: 700; }
  .m-body { padding: 20px 28px 26px; font: 500 19px/1.55 'Inter'; }
  .m-sign { position: relative; display: inline-block; margin-top: 16px; font-weight: 800; color: #0E3D4E; }
  .m-sign .mark { position: absolute; left: -6px; right: -6px; bottom: 1px; height: 13px; background: rgba(224,107,82,.45); border-radius: 4px; transform-origin: left; z-index: 0; }
  .m-sign span { position: relative; z-index: 1; }
  .chip { position: absolute; padding: 12px 20px; border-radius: 99px; background: var(--coral); color: #fff; font: 800 17px 'Inter'; letter-spacing: .01em; box-shadow: 0 16px 40px rgba(224,107,82,.4); white-space: nowrap; }
</style>
</head>
<body>
<script src="scene-kit.js"></script>
<script>
(function () {
  const K = SceneKit;
  const L = 18;

  const BASE = [
    { id: '#48210', title: 'Accès dossier partagé — Compta', who: 'Groupe Arnaud BTP', end: 'done' },
    { id: '#48209', title: 'Boîte mail pleine — archivage', who: 'Étude Bernard & Associés', end: 'done' },
    { id: '#48207', title: 'MFA — nouveau téléphone', who: 'Transports Lemoine', end: 'done' },
  ];
  const NEW = [
    { a: 0.9, id: '#48213', title: 'VPN — connexion impossible', who: 'Cabinet Morel · Lyon', end: 'done' },
    { a: 2.5, id: '#48214', title: 'Mot de passe AD expiré', who: 'Groupe Arnaud BTP', end: 'done' },
    { a: 4.1, id: '#48215', title: 'Nouvel arrivant — Teams + mail', who: 'Clinique vétérinaire du Parc', end: 'done' },
    { a: 5.7, id: '#48216', title: 'Serveur de fichiers inaccessible', who: 'Transports Lemoine', end: 'esc' },
    { a: 7.3, id: '#48217', title: 'Imprimante 2e étage hors ligne', who: 'Étude Bernard & Associés', end: 'done' },
  ];
  const TAKE = 0.9, WORK = 2.4;
  const LABEL = { new: 'Nouveau', take: 'Pris en charge', done: 'Résolu', esc: 'Escaladé N2' };

  function mount(root, orient) {
    const P = orient === 'portrait'
      ? { W: 1080, H: 1920, px: 50, py: 1000, pw: 980, ph: 780, slot: 96, slots: 6, mx: 90, my: 1330, mw: 900, cx: 90, cy: 1260, tx: 540, ty: 1870, ta: 'center' }
      : { W: 1920, H: 1080, px: 990, py: 150, pw: 850, ph: 790, slot: 98, slots: 6, mx: 1050, my: 520, mw: 740, cx: 1050, cy: 448, tx: 1840, ty: 1030, ta: 'right' };

    K.el('div', 'bg', root);
    const grid = K.el('div', 'grid', root);
    const h1 = K.el('div', 'halo c', root);
    const h2 = K.el('div', 'halo t', root);

    const panel = K.el('div', 'panel', root);
    Object.assign(panel.style, { left: P.px + 'px', top: P.py + 'px', width: P.pw + 'px', height: P.ph + 'px' });
    K.el('div', 'p-head', panel, '<div class="dots"><i></i><i></i><i></i></div><div class="p-logo">VOTRE LOGO</div><div class="p-title">Centre de services</div><div class="p-user"><div class="avatar">VE</div>Support · Votre ESN</div>');
    K.el('div', 'p-tabs', panel, '<span class="on">File N1</span><span>Mes tickets</span><span>Escalades N2</span>');
    K.el('div', 'p-cols', panel, '<span>Ticket · demandeur</span><span>Statut</span>');
    const rowsTop = 70 + 52 + 40;
    const rows = K.el('div', 'rows', panel);
    rows.style.top = rowsTop + 'px'; rows.style.bottom = '0';

    function mkRow(d) {
      const r = K.el('div', 'row', rows);
      r.style.height = P.slot + 'px';
      const flash = K.el('div', 'flash', r);
      K.el('div', '', r, `<div class="r-id">${d.id}</div><div class="r-title">${d.title}</div><div class="r-who">${d.who}</div>`);
      const st = K.el('div', 'r-stat', r);
      const pills = {};
      for (const k of ['new', 'take', d.end]) pills[k] = K.el('span', 'pill ' + k, st, LABEL[k]);
      const by = K.el('div', 'by', st, d.end === 'esc' ? 'Transmis à votre N2' : 'Support Votre ESN');
      return { r, pills, by, flash, d };
    }
    const baseRows = BASE.map(mkRow);
    const newRows = NEW.map(mkRow);

    const mail = K.el('div', 'mail', root);
    Object.assign(mail.style, { left: P.mx + 'px', top: P.my + 'px', width: P.mw + 'px' });
    mail.innerHTML = `
      <div class="m-head">De : <b>support@votre-esn.fr</b><br>À : c.morel@…<br>Objet : <b>[#48213] VPN rétabli</b></div>
      <div class="m-body">Bonjour Madame Morel,<br>votre accès VPN est rétabli : le certificat a été renouvelé sur votre poste. Répondez simplement à ce message si besoin.<br>
        <div class="m-sign"><div class="mark"></div><span>L'équipe support — Votre ESN</span></div></div>`;
    const mark = mail.querySelector('.mark');
    const chip = K.el('div', 'chip', root, 'Votre marque · vos outils · votre ton');
    Object.assign(chip.style, { left: P.cx + 'px', top: P.cy + 'px' });

    const tag = K.el('div', 'tag-illu', root, 'Illustration · données fictives');
    tag.style.textAlign = P.ta;
    if (P.ta === 'right') { tag.style.right = (P.W - P.tx) + 'px'; } else { tag.style.left = '0'; tag.style.right = '0'; }
    tag.style.top = (P.ty - 20) + 'px';

    return function update(t) {
      // Décor périodique sur L : identique à t = 0 et t = L.
      const w = 2 * Math.PI * t / L;
      grid.style.transform = `translate(${(Math.sin(w) * 20).toFixed(2)}px, ${(Math.cos(w) * 14).toFixed(2)}px)`;
      h1.style.transform = `translate(${(P.px + P.pw * 0.55 + Math.sin(w) * 90 - 360).toFixed(1)}px, ${(P.py + P.ph * 0.25 + Math.cos(w) * 60 - 360).toFixed(1)}px)`;
      h2.style.transform = `translate(${(P.px - 300 + Math.cos(w) * 120 - 450).toFixed(1)}px, ${(P.py + P.ph - 200 + Math.sin(w) * 80 - 450).toFixed(1)}px)`;

      // Pile de tickets, du plus récent (en haut) au plus ancien.
      const pres = NEW.map(d => K.easeOut(K.seg(t, d.a, d.a + 0.55)));
      const all = [...newRows.map((x, i) => ({ x, i })).reverse(), ...baseRows.map(x => ({ x, i: -1 }))];
      let y = 0;
      all.forEach(({ x, i }) => {
        const p = i >= 0 ? pres[i] : 1;
        const top = (y - (i >= 0 ? (1 - p) * 0.6 : 0)) * P.slot;
        const fadeOut = K.clamp(P.slots - 0.2 - y);
        x.r.style.transform = `translateY(${top.toFixed(2)}px)`;
        x.r.style.opacity = (Math.min(i >= 0 ? p : 1, fadeOut) * (i >= 0 ? 1 : 0.6)).toFixed(3);
        y += i >= 0 ? p : 1;

        // Statut
        let s = x.d.end, byo = 1, fl = 0;
        if (i >= 0) {
          const a = NEW[i].a;
          const tk = K.seg(t, a + TAKE, a + TAKE + 0.3), fin = K.seg(t, a + TAKE + WORK, a + TAKE + WORK + 0.3);
          x.pills.new.style.opacity = (1 - tk).toFixed(3);
          x.pills.take.style.opacity = (tk * (1 - fin)).toFixed(3);
          x.pills[x.d.end].style.opacity = fin.toFixed(3);
          x.pills.take.style.transform = `scale(${(0.9 + 0.1 * K.backOut(tk)).toFixed(3)})`;
          byo = tk;
          fl = K.window(t, a + TAKE, a + TAKE + 0.25, 0.25) * 0.9 + K.window(t, a + TAKE + WORK, a + TAKE + WORK + 0.2, 0.3) * 0.5;
        } else {
          x.pills.new.style.opacity = 0; x.pills.take.style.opacity = 0; x.pills[s].style.opacity = 1;
        }
        if (x.d.end === 'esc' && i >= 0) {
          const a = NEW[i].a, fin = K.seg(t, a + TAKE + WORK, a + TAKE + WORK + 0.3);
          x.by.textContent = fin > 0.5 ? 'Transmis à votre N2' : 'Support Votre ESN';
          x.by.style.color = fin > 0.5 ? '#FFCB57' : '';
        }
        x.by.style.opacity = (byo * 0.9).toFixed(3);
        x.flash.style.opacity = fl.toFixed(3);
      });

      // Gros plan sur la réponse envoyée au client final (ticket #48213).
      const mIn = K.easeOut(K.seg(t, 9.2, 10.0)), mOut = K.easeIn(K.seg(t, 14.4, 15.1));
      mail.style.opacity = (mIn * (1 - mOut)).toFixed(3);
      mail.style.transform = `translateY(${((1 - mIn) * 70 + mOut * 40).toFixed(1)}px) scale(${(0.96 + 0.04 * mIn).toFixed(3)})`;
      mark.style.transform = `scaleX(${K.easeInOut(K.seg(t, 10.9, 11.7)).toFixed(3)})`;
      const cIn = K.backOut(K.seg(t, 11.5, 12.1)), cOut = K.seg(t, 14.2, 14.7);
      chip.style.opacity = (K.seg(t, 11.5, 11.8) * (1 - cOut)).toFixed(3);
      chip.style.transform = `translateY(${((1 - cIn) * 20).toFixed(1)}px)`;

    };
  }

  K.run({ duration: L, fade: 0.9, design: { landscape: [1920, 1080], portrait: [1080, 1920] }, mount });
})();
</script>
</body>
</html>
